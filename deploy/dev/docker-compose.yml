name: data-os-dev

services:
  control-plane:
    image: medical-platform/data-os-control-plane:0.1.0-dev
    environment:
      SERVER_PORT: 8080
      DATAOS_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      DATAOS_DB_USERNAME: keycloak
      DATAOS_DB_PASSWORD: ${DATAOS_DB_PASSWORD:?请在远程 .env 中提供 DATAOS_DB_PASSWORD}
      DATAOS_DB_POOL_SIZE: ${DATAOS_DB_POOL_SIZE:-10}
      DATAOS_RUNTIME_ENV: ${DATAOS_RUNTIME_ENV:-development}
      DATAOS_AUTH_MODE: ${DATAOS_AUTH_MODE:-DISABLED}
      DATAOS_OIDC_ISSUER_URI: ${DATAOS_OIDC_ISSUER_URI:-}
      DATAOS_OIDC_AUDIENCE: ${DATAOS_OIDC_AUDIENCE:-data-os}
      DATAOS_FLYWAY_BASELINE_ON_MIGRATE: ${DATAOS_FLYWAY_BASELINE_ON_MIGRATE:-true}
      DATAOS_CREDENTIAL_ENCRYPTION_KEY: ${DATAOS_CREDENTIAL_ENCRYPTION_KEY:-}
      DATAOS_SOURCE_ALLOW_HTTP: ${DATAOS_SOURCE_ALLOW_HTTP:-true}
      DATAOS_SOURCE_ALLOW_PRIVATE_NETWORKS: ${DATAOS_SOURCE_ALLOW_PRIVATE_NETWORKS:-true}
      DATAOS_SOURCE_ALLOW_TEST_PROTOCOLS: ${DATAOS_SOURCE_ALLOW_TEST_PROTOCOLS:-true}
      DATAOS_SOURCE_ALLOWED_HOSTS: ${DATAOS_SOURCE_ALLOWED_HOSTS:-}
      DATAOS_SEED_DEMO: ${DATAOS_SEED_DEMO:-true}
      DATAOS_RUN_SYNC_INTERVAL_MS: ${DATAOS_RUN_SYNC_INTERVAL_MS:-30000}
      DATAOS_RUN_SYNC_INITIAL_DELAY_MS: ${DATAOS_RUN_SYNC_INITIAL_DELAY_MS:-10000}
      DATAOS_SEATUNNEL_TIME_ZONE: ${DATAOS_SEATUNNEL_TIME_ZONE:-UTC}
      SEATUNNEL_BASE_URL: ${SEATUNNEL_BASE_URL:-}
      DATAOS_QUALITY_EXECUTOR: ${DATAOS_QUALITY_EXECUTOR:-DEMO}
      DATAOS_QUALITY_EXECUTOR_BASE_URL: ${DATAOS_QUALITY_EXECUTOR_BASE_URL:-}
      DATAOS_QUALITY_DEMO_ENABLED: ${DATAOS_QUALITY_DEMO_ENABLED:-true}
      DATAOS_QUALITY_SUBMIT_LEASE_MS: ${DATAOS_QUALITY_SUBMIT_LEASE_MS:-120000}
      DATAOS_QUALITY_DEMO_DELAY_MS: ${DATAOS_QUALITY_DEMO_DELAY_MS:-1500}
      DATAOS_QUALITY_POLL_INTERVAL_MS: ${DATAOS_QUALITY_POLL_INTERVAL_MS:-30000}
      DATAOS_QUALITY_POLL_INITIAL_DELAY_MS: ${DATAOS_QUALITY_POLL_INITIAL_DELAY_MS:-10000}
      DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS: ${DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS:-60000}
      DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS: ${DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS:-15000}
      DATAOS_NOTIFICATION_WEBHOOK_URL: ${DATAOS_NOTIFICATION_WEBHOOK_URL:-}
      DATAOS_NOTIFICATION_MAX_ATTEMPTS: ${DATAOS_NOTIFICATION_MAX_ATTEMPTS:-5}
      DATAOS_NOTIFICATION_LEASE_MS: ${DATAOS_NOTIFICATION_LEASE_MS:-120000}
      DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS: ${DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS:-30000}
      DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS: ${DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS:-10000}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 12
    networks:
      - platform-net
    restart: unless-stopped

  portal:
    image: nginx:1.27
    ports:
      - "${DATAOS_PORTAL_PORT:-18081}:80"
    volumes:
      - ./portal-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - platform-net
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  seatunnel-master:
    image: ${SEATUNNEL_IMAGE:-medical-platform/data-os-seatunnel:2.3.13-dev}
    profiles:
      - executor
    environment:
      ST_DOCKER_MEMBER_COUNT: "1"
    ports:
      - "${SEATUNNEL_HTTP_PORT:-18082}:8080"
      - "${SEATUNNEL_CLUSTER_PORT:-15801}:5801"
    volumes:
      - ./seatunnel/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/overview >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12
    networks:
      - platform-net
    restart: unless-stopped

networks:
  platform-net:
    external: true
    name: medical-platform_platform-net
