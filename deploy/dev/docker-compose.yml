name: data-os-dev

services:
  control-plane:
    image: ${DATAOS_CONTROL_PLANE_IMAGE:-medical-platform/data-os-control-plane:0.1.0-dev}
    environment:
      SERVER_PORT: 8080
      DATAOS_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      DATAOS_DB_USERNAME: keycloak
      DATAOS_DB_PASSWORD: ${DATAOS_DB_PASSWORD:?请在远程 .env 中提供 DATAOS_DB_PASSWORD}
      DATAOS_DB_POOL_SIZE: ${DATAOS_DB_POOL_SIZE:-10}
      DATAOS_RUNTIME_ENV: ${DATAOS_RUNTIME_ENV:-development}
      DATAOS_AUTH_MODE: ${DATAOS_AUTH_MODE:-DISABLED}
      DATAOS_OIDC_ISSUER_URI: ${DATAOS_OIDC_ISSUER_URI:-}
      DATAOS_OIDC_AUDIENCE: ${DATAOS_OIDC_AUDIENCE:-data-os}
      DATAOS_DEFAULT_SCOPE_ENABLED: ${DATAOS_DEFAULT_SCOPE_ENABLED:-true}
      DATAOS_DEFAULT_TENANT_ID: ${DATAOS_DEFAULT_TENANT_ID:-default}
      DATAOS_DEFAULT_INSTITUTION_ID: ${DATAOS_DEFAULT_INSTITUTION_ID:-demo-hospital}
      DATAOS_FLYWAY_BASELINE_ON_MIGRATE: ${DATAOS_FLYWAY_BASELINE_ON_MIGRATE:-true}
      DATAOS_CREDENTIAL_ENCRYPTION_KEY: ${DATAOS_CREDENTIAL_ENCRYPTION_KEY:-}
      DATAOS_SOURCE_ALLOW_HTTP: ${DATAOS_SOURCE_ALLOW_HTTP:-true}
      DATAOS_SOURCE_ALLOW_PRIVATE_NETWORKS: ${DATAOS_SOURCE_ALLOW_PRIVATE_NETWORKS:-true}
      DATAOS_SOURCE_ALLOW_TEST_PROTOCOLS: ${DATAOS_SOURCE_ALLOW_TEST_PROTOCOLS:-true}
      DATAOS_SOURCE_ALLOWED_HOSTS: ${DATAOS_SOURCE_ALLOWED_HOSTS:-}
      DATAOS_SEED_DEMO: ${DATAOS_SEED_DEMO:-true}
      DATAOS_RUN_SYNC_INTERVAL_MS: ${DATAOS_RUN_SYNC_INTERVAL_MS:-30000}
      DATAOS_RUN_SYNC_INITIAL_DELAY_MS: ${DATAOS_RUN_SYNC_INITIAL_DELAY_MS:-10000}
      # G2 血缘 BFF：base-url 为空时整链不装配（血缘 API 503）
      DATAOS_OPENMETADATA_BASE_URL: ${DATAOS_OPENMETADATA_BASE_URL:-}
      DATAOS_OPENMETADATA_TOKEN_URI: ${DATAOS_OPENMETADATA_TOKEN_URI:-}
      DATAOS_OPENMETADATA_CLIENT_ID: ${DATAOS_OPENMETADATA_CLIENT_ID:-}
      DATAOS_OPENMETADATA_CLIENT_SECRET: ${DATAOS_OPENMETADATA_CLIENT_SECRET:-}
      # G4 嵌入式分析：base-url 为空时整链不装配（分析 API 503）
      DATAOS_SUPERSET_BASE_URL: ${DATAOS_SUPERSET_BASE_URL:-}
      DATAOS_SUPERSET_USERNAME: ${DATAOS_SUPERSET_USERNAME:-}
      DATAOS_SUPERSET_PASSWORD: ${DATAOS_SUPERSET_PASSWORD:-}
      DATAOS_SUPERSET_GUEST_ROLE: ${DATAOS_SUPERSET_GUEST_ROLE:-Viewer}
      DATAOS_SUPERSET_GUEST_TOKEN_TTL_SECONDS: ${DATAOS_SUPERSET_GUEST_TOKEN_TTL_SECONDS:-300}
      DATAOS_SUPERSET_ALLOWED_DASHBOARDS: ${DATAOS_SUPERSET_ALLOWED_DASHBOARDS:-2}
      DATAOS_SEATUNNEL_TIME_ZONE: ${DATAOS_SEATUNNEL_TIME_ZONE:-UTC}
      SEATUNNEL_BASE_URL: ${SEATUNNEL_BASE_URL:-}
      DATAOS_SEATUNNEL_UI_URL: ${DATAOS_SEATUNNEL_UI_URL:-}
      DOLPHINSCHEDULER_BASE_URL: ${DOLPHINSCHEDULER_BASE_URL:-http://dolphinscheduler-api:12345/dolphinscheduler}
      DATAOS_DOLPHINSCHEDULER_UI_URL: ${DATAOS_DOLPHINSCHEDULER_UI_URL:-}
      DATAOS_DOLPHINSCHEDULER_TOKEN: ${DATAOS_DOLPHINSCHEDULER_TOKEN:-}
      DATAOS_DOLPHINSCHEDULER_TOKEN_FILE: ${DATAOS_DOLPHINSCHEDULER_TOKEN_FILE:-/run/secrets/dolphinscheduler-token.json}
      DATAOS_DOLPHINSCHEDULER_USERNAME: ${DATAOS_DOLPHINSCHEDULER_USERNAME:-}
      DATAOS_DOLPHINSCHEDULER_PASSWORD: ${DATAOS_DOLPHINSCHEDULER_PASSWORD:-}
      DATAOS_DOLPHINSCHEDULER_TIME_ZONE: ${DATAOS_DOLPHINSCHEDULER_TIME_ZONE:-Asia/Shanghai}
      DATAOS_DOLPHINSCHEDULER_TENANT_CODE: ${DATAOS_DOLPHINSCHEDULER_TENANT_CODE:-dataos-dev}
      DATAOS_QUALITY_EXECUTOR: ${DATAOS_QUALITY_EXECUTOR:-HTTP}
      DATAOS_QUALITY_EXECUTOR_BASE_URL: ${DATAOS_QUALITY_EXECUTOR_BASE_URL:-http://quality-runner:8080}
      DATAOS_QUALITY_DEMO_ENABLED: ${DATAOS_QUALITY_DEMO_ENABLED:-false}
      DATAOS_QUALITY_OIDC_TOKEN_URI: ${DATAOS_QUALITY_OIDC_TOKEN_URI:-}
      DATAOS_QUALITY_OIDC_CLIENT_ID: ${DATAOS_QUALITY_OIDC_CLIENT_ID:-}
      DATAOS_QUALITY_OIDC_CLIENT_SECRET: ${DATAOS_QUALITY_OIDC_CLIENT_SECRET:-}
      DATAOS_QUALITY_OIDC_AUDIENCE: ${DATAOS_QUALITY_OIDC_AUDIENCE:-dataos-quality-runner}
      DATAOS_QUALITY_OIDC_SCOPES: ${DATAOS_QUALITY_OIDC_SCOPES:-quality:submit quality:read}
      DATAOS_QUALITY_SUBMIT_LEASE_MS: ${DATAOS_QUALITY_SUBMIT_LEASE_MS:-120000}
      DATAOS_QUALITY_DEMO_DELAY_MS: ${DATAOS_QUALITY_DEMO_DELAY_MS:-1500}
      DATAOS_QUALITY_POLL_INTERVAL_MS: ${DATAOS_QUALITY_POLL_INTERVAL_MS:-30000}
      DATAOS_QUALITY_POLL_INITIAL_DELAY_MS: ${DATAOS_QUALITY_POLL_INITIAL_DELAY_MS:-10000}
      DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS: ${DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS:-60000}
      DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS: ${DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS:-15000}
      DATAOS_NOTIFICATION_WEBHOOK_URL: ${DATAOS_NOTIFICATION_WEBHOOK_URL:-http://notification-receiver:8080/notify}
      DATAOS_NOTIFICATION_HEALTH_URL: ${DATAOS_NOTIFICATION_HEALTH_URL:-http://notification-receiver:8080/healthz}
      DATAOS_NOTIFICATION_WEBHOOK_SECRET: ${DATAOS_NOTIFICATION_WEBHOOK_SECRET:-dev-only-notification-secret-change-me}
      DATAOS_NOTIFICATION_WEBHOOK_SECRET_FILE: ${DATAOS_NOTIFICATION_WEBHOOK_SECRET_FILE:-}
      DATAOS_NOTIFICATION_ALLOW_HTTP: ${DATAOS_NOTIFICATION_ALLOW_HTTP:-true}
      DATAOS_NOTIFICATION_ALLOW_PRIVATE_NETWORKS: ${DATAOS_NOTIFICATION_ALLOW_PRIVATE_NETWORKS:-true}
      DATAOS_NOTIFICATION_ALLOWED_HOSTS: ${DATAOS_NOTIFICATION_ALLOWED_HOSTS:-notification-receiver}
      DATAOS_NOTIFICATION_MAX_ATTEMPTS: ${DATAOS_NOTIFICATION_MAX_ATTEMPTS:-5}
      DATAOS_NOTIFICATION_LEASE_MS: ${DATAOS_NOTIFICATION_LEASE_MS:-120000}
      DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS: ${DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS:-30000}
      DATAOS_RUN_SUBMIT_LEASE_MS: ${DATAOS_RUN_SUBMIT_LEASE_MS:-120000}
      DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS: ${DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS:-10000}
      DATAOS_RUSTFS_ENDPOINT: ${DATAOS_RUSTFS_ENDPOINT:-http://rustfs:9000}
      DATAOS_RUSTFS_CONSOLE_URL: ${DATAOS_RUSTFS_CONSOLE_URL:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 12
    networks:
      - platform-net
    volumes:
      - scheduler-token-secrets:/run/secrets:ro
    restart: unless-stopped

  rustfs:
    # Development S3-compatible object storage for quality artifacts. Override
    # DATAOS_RUSTFS_IMAGE with an immutable digest in controlled environments.
    image: ${DATAOS_RUSTFS_IMAGE:-rustfs/rustfs:latest}
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${DATAOS_RUSTFS_ACCESS_KEY:?请在远程 .env 中提供 DATAOS_RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${DATAOS_RUSTFS_SECRET_KEY:?请在远程 .env 中提供 DATAOS_RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: ${DATAOS_RUSTFS_LOG_LEVEL:-error}
      RUSTFS_SSE_S3_MASTER_KEY: ${DATAOS_RUSTFS_SSE_S3_MASTER_KEY:?请在远程 .env 中提供 DATAOS_RUSTFS_SSE_S3_MASTER_KEY（Base64 编码的 32 字节密钥）}
    ports:
      - "${DATAOS_RUSTFS_PORT:-19000}:9000"
      - "${DATAOS_RUSTFS_CONSOLE_PORT:-19001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks:
      - platform-net
    restart: unless-stopped

  rustfs-init:
    # Reuse the quality-runner Python image for a one-shot, idempotent bucket
    # bootstrap. No MinIO client or additional runtime is introduced.
    image: ${DATAOS_QUALITY_RUNNER_IMAGE:-medical-platform/data-os-quality-runner:0.1.0-dev}
    environment:
      DATAOS_RUSTFS_ENDPOINT: http://rustfs:9000
      DATAOS_RUSTFS_BUCKET: ${DATAOS_RUSTFS_BUCKET:-dataos-quality-artifacts}
      DATAOS_RUSTFS_ACCESS_KEY: ${DATAOS_RUSTFS_ACCESS_KEY:?请在远程 .env 中提供 DATAOS_RUSTFS_ACCESS_KEY}
      DATAOS_RUSTFS_SECRET_KEY: ${DATAOS_RUSTFS_SECRET_KEY:?请在远程 .env 中提供 DATAOS_RUSTFS_SECRET_KEY}
    entrypoint: ["python", "-c"]
    command:
      - |
        import os
        import time
        import boto3

        endpoint = os.environ["DATAOS_RUSTFS_ENDPOINT"]
        bucket = os.environ["DATAOS_RUSTFS_BUCKET"]
        client = boto3.client(
            "s3",
            endpoint_url=endpoint,
            region_name="us-east-1",
            aws_access_key_id=os.environ["DATAOS_RUSTFS_ACCESS_KEY"],
            aws_secret_access_key=os.environ["DATAOS_RUSTFS_SECRET_KEY"],
        )
        last = None
        for _ in range(30):
            try:
                client.list_buckets()
                break
            except Exception as exc:
                last = exc
                time.sleep(2)
        else:
            raise last
        try:
            client.head_bucket(Bucket=bucket)
        except Exception:
            client.create_bucket(Bucket=bucket)
        print("RustFS bucket ready:", bucket)
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - platform-net
    restart: "no"

  quality-runner:
    build:
      context: ../..
      dockerfile: services/quality-runner/Dockerfile
    image: ${DATAOS_QUALITY_RUNNER_IMAGE:-medical-platform/data-os-quality-runner:0.1.0-dev}
    environment:
      QUALITY_RUNNER_ENV: ${QUALITY_RUNNER_ENV:-development}
      QUALITY_RUNNER_AUTH_MODE: ${QUALITY_RUNNER_AUTH_MODE:-DISABLED}
      QUALITY_RUNNER_OIDC_ISSUER: ${QUALITY_RUNNER_OIDC_ISSUER:-}
      QUALITY_RUNNER_OIDC_AUDIENCE: ${QUALITY_RUNNER_OIDC_AUDIENCE:-dataos-quality-runner}
      QUALITY_RUNNER_OIDC_REQUIRED_SCOPES: ${QUALITY_RUNNER_OIDC_REQUIRED_SCOPES:-quality:submit quality:read}
      # The runner shares the dev data_os schema. Override this with the
      # actual keycloak-db password in the host .env; the default is only a
      # syntactically valid placeholder so `docker compose config` can run.
      QUALITY_RUNNER_DB_URL: ${QUALITY_RUNNER_DB_URL:-postgresql+psycopg://${DATAOS_DB_USERNAME:-keycloak}:${DATAOS_DB_PASSWORD}@keycloak-db:5432/keycloak}
      QUALITY_RUNNER_PROJECT_DIR: /opt/dataos/quality/dbt
      QUALITY_RUNNER_PROFILES_DIR: /opt/dataos/quality/dbt
      QUALITY_RUNNER_DBT_TARGET: ${QUALITY_RUNNER_DBT_TARGET:-quality}
      QUALITY_RUNNER_MAX_CONCURRENCY: ${QUALITY_RUNNER_MAX_CONCURRENCY:-2}
      QUALITY_RUNNER_MAX_CONCURRENCY_PER_TENANT: ${QUALITY_RUNNER_MAX_CONCURRENCY_PER_TENANT:-1}
      QUALITY_RUNNER_TIMEOUT_SECONDS: ${QUALITY_RUNNER_TIMEOUT_SECONDS:-900}
      QUALITY_RUNNER_EVIDENCE_LIMIT: ${QUALITY_RUNNER_EVIDENCE_LIMIT:-20}
      DORIS_FE_HOST: ${DORIS_FE_HOST:-172.16.66.8}
      DORIS_FE_PORT: ${DORIS_FE_PORT:-9030}
      DORIS_DATABASE: ${DORIS_DATABASE:-dataos_quality_acceptance}
      DORIS_AUDIT_DATABASE: ${DORIS_AUDIT_DATABASE:-dataos_quality_audit}
      DORIS_USER: ${DORIS_USER:-}
      DORIS_PASSWORD: ${DORIS_PASSWORD:-}
      DORIS_DBT_USER: ${DORIS_DBT_USER:-}
      DORIS_DBT_PASSWORD: ${DORIS_DBT_PASSWORD:-}
      DORIS_CLEANUP_USER: ${DORIS_CLEANUP_USER:-}
      DORIS_CLEANUP_PASSWORD: ${DORIS_CLEANUP_PASSWORD:-}
      QUALITY_RUNNER_S3_ENDPOINT: ${QUALITY_RUNNER_S3_ENDPOINT:-http://rustfs:9000}
      QUALITY_RUNNER_S3_BUCKET: ${QUALITY_RUNNER_S3_BUCKET:-${DATAOS_RUSTFS_BUCKET:-dataos-quality-artifacts}}
      QUALITY_RUNNER_S3_ACCESS_KEY: ${DATAOS_RUSTFS_ACCESS_KEY:-}
      QUALITY_RUNNER_S3_SECRET_KEY: ${DATAOS_RUSTFS_SECRET_KEY:-}
    expose:
      - "8080"
    volumes:
      - quality-runner-artifacts:/var/lib/dataos-quality/artifacts
    networks:
      - platform-net
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mpi-service:
    # 患者主索引独立服务（docs/mpi-g3-review-and-plan-20260819.md）。
    # G3.1 脚手架：无存储依赖；G3.2 起接入 PG data_os_mpi 与 Doris dataos_mpi。
    build:
      context: ../..
      dockerfile: services/mpi-service/Dockerfile
    image: ${DATAOS_MPI_IMAGE:-medical-platform/data-os-mpi-service:0.1.0-dev}
    environment:
      SERVER_PORT: 8080
      DATAOS_MPI_AUTH_MODE: ${DATAOS_MPI_AUTH_MODE:-DISABLED}
      DATAOS_MPI_OIDC_ISSUER_URI: ${DATAOS_MPI_OIDC_ISSUER_URI:-${DATAOS_OIDC_ISSUER_URI:-}}
      DATAOS_MPI_OIDC_AUDIENCE: ${DATAOS_MPI_OIDC_AUDIENCE:-data-os-mpi}
      DATAOS_MPI_DEFAULT_TENANT_ID: ${DATAOS_DEFAULT_TENANT_ID:-default}
      DATAOS_MPI_DEFAULT_INSTITUTION_ID: ${DATAOS_DEFAULT_INSTITUTION_ID:-demo-hospital}
      # 独占账号连同一 PG 实例的 keycloak 库，schema data_os_mpi 由服务 Flyway 迁移。
      DATAOS_MPI_DB_URL: ${DATAOS_MPI_DB_URL:-jdbc:postgresql://keycloak-db:5432/keycloak}
      DATAOS_MPI_DB_USERNAME: ${DATAOS_MPI_DB_USERNAME:-dataos_mpi}
      DATAOS_MPI_DB_PASSWORD: ${DATAOS_MPI_DB_PASSWORD:?请在远程 .env 中提供 DATAOS_MPI_DB_PASSWORD}
      # Doris 批处理通道（读 ods_ep / 读写 dataos_mpi），未设置时服务可启动、rebuild 503。
      DATAOS_MPI_DORIS_URL: ${DATAOS_MPI_DORIS_URL:-jdbc:mysql://172.16.66.8:9030/dataos_mpi?useSSL=false&characterEncoding=utf8&rewriteBatchedStatements=true}
      DATAOS_MPI_DORIS_USERNAME: ${DATAOS_MPI_DORIS_USERNAME:-dataos_mpi}
      DATAOS_MPI_DORIS_PASSWORD: ${DATAOS_MPI_DORIS_PASSWORD:-${DORIS_MPI_PASSWORD:?请在远程 .env 中提供 DORIS_MPI_PASSWORD}}
      # 敏感字段加盐哈希盐值：仅存 .env。
      DATAOS_MPI_HASH_SALT: ${DATAOS_MPI_HASH_SALT:?请在远程 .env 中提供 DATAOS_MPI_HASH_SALT}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 4s
      start_period: 15s
      retries: 12
    networks:
      - platform-net
    restart: unless-stopped

  notification-receiver:
    build:
      context: ../..
      dockerfile: deploy/dev/notification-receiver/Dockerfile
    image: ${DATAOS_NOTIFICATION_RECEIVER_IMAGE:-medical-platform/data-os-notification-receiver:0.1.0-dev}
    environment:
      DATAOS_NOTIFICATION_RECEIVER_SECRET: ${DATAOS_NOTIFICATION_WEBHOOK_SECRET:-dev-only-notification-secret-change-me}
    expose:
      - "8080"
    networks:
      - platform-net
    restart: unless-stopped

  portal:
    image: nginx:1.27
    ports:
      - "${DATAOS_PORTAL_PORT:-18081}:80"
      # G4 嵌入式 Superset 专用监听（只承载 iframe，见 nginx.conf）
      - "${DATAOS_SUPERSET_EMBED_PORT:-18084}:8084"
    volumes:
      - ./portal-dist:/usr/share/nginx/html:ro,Z
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
    networks:
      - platform-net
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped

  seatunnel-master:
    image: ${SEATUNNEL_IMAGE:-medical-platform/data-os-seatunnel:2.3.13-dataos.2}
    profiles:
      - executor
    environment:
      ST_DOCKER_MEMBER_COUNT: "1"
    ports:
      - "${SEATUNNEL_HTTP_PORT:-18082}:8080"
      - "${SEATUNNEL_CLUSTER_PORT:-15801}:5801"
    volumes:
      - ./seatunnel/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/overview >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12
    networks:
      - platform-net
    restart: unless-stopped

  scheduler-token-rotator:
    profiles:
      - scheduler
    build:
      context: ../..
      dockerfile: deploy/dev/scheduler-token-rotator/Dockerfile
    image: ${DATAOS_SCHEDULER_TOKEN_ROTATOR_IMAGE:-medical-platform/data-os-scheduler-token-rotator:0.1.0-dev}
    environment:
      DOLPHINSCHEDULER_BASE_URL: ${DOLPHINSCHEDULER_BASE_URL:-http://dolphinscheduler-api:12345/dolphinscheduler}
      DOLPHINSCHEDULER_TOKEN_FILE: /run/secrets/dolphinscheduler-token.json
      DOLPHINSCHEDULER_TOKEN_USER_ID: ${DOLPHINSCHEDULER_TOKEN_USER_ID:-0}
      DOLPHINSCHEDULER_TOKEN_TTL_DAYS: ${DOLPHINSCHEDULER_TOKEN_TTL_DAYS:-7}
      DOLPHINSCHEDULER_TOKEN_ROTATE_HOURS: ${DOLPHINSCHEDULER_TOKEN_ROTATE_HOURS:-24}
      DOLPHINSCHEDULER_TOKEN_OVERLAP_MINUTES: ${DOLPHINSCHEDULER_TOKEN_OVERLAP_MINUTES:-30}
    volumes:
      - scheduler-token-secrets:/run/secrets
    depends_on:
      scheduler-token-permissions:
        condition: service_completed_successfully
    networks:
      - platform-net
    restart: unless-stopped

  # The rotator is intentionally non-root.  This one-shot helper only fixes
  # ownership on a newly-created named volume before the rotator starts; it
  # does not receive the token value and has no network access.
  scheduler-token-permissions:
    profiles:
      - scheduler
    image: ${DATAOS_SCHEDULER_TOKEN_ROTATOR_IMAGE:-medical-platform/data-os-scheduler-token-rotator:0.1.0-dev}
    user: "0:0"
    entrypoint: ["python", "-c"]
    command:
      - >-
        import os;
        from pathlib import Path;
        p=Path('/run/secrets'); p.mkdir(parents=True, exist_ok=True);
        f=p/'dolphinscheduler-token.json';
        f.exists() and (os.chown(f,100,101), os.chmod(f,0o600));
        os.chown(p,100,101); os.chmod(p,0o700)
    volumes:
      - scheduler-token-secrets:/run/secrets
    restart: "no"

networks:
  platform-net:
    external: true
    name: medical-platform_platform-net

volumes:
  quality-runner-artifacts:
    name: data-os-dev-quality-runner-artifacts
  scheduler-token-secrets:
    name: data-os-dev-scheduler-token-secrets
  rustfs-data:
    name: data-os-dev-rustfs-data
