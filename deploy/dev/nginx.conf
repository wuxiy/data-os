# S4（安全收敛批）：访客令牌签发限流（每 IP 10/min，突发 5；本文件被 http 上下文 include）
limit_req_zone $binary_remote_addr zone=guest_token:10m rate=10r/m;
# P8（H3）：data-api 网关级限流（每 IP 2/s，突发 40）——挡扫描与失控客户端；
# 单 Key 精度配额仍在应用层（registry 日配额 + 429）。
limit_req_zone $binary_remote_addr zone=dataapi:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MPI 服务直路由：/api/v1/mpi/ 前缀完整转发（不改写路径），服务自持该命名空间。
    # portal 不依赖 mpi-service 存活——服务摘除时此路由 502，门户侧如实空态。
    location /api/v1/mpi/ {
        proxy_pass http://mpi-service:8080;
        proxy_http_version 1.1;
        # rebuild 是同步批处理端点：放宽读超时兜底（常规规模秒级返回）。
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S4：guest-token 签发走限流（超限 503）；其余 /api 语义不变
    location /api/v1/analytics/guest-token {
        limit_req zone=guest_token burst=5 nodelay;
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # G13 ToB 数据 API：外部调用方路径（strip /dataapi 前缀），鉴权在服务内（X-API-Key）；
    # P8（H3）：网关级限流（超限 503）
    location /dataapi/ {
        limit_req zone=dataapi burst=40 nodelay;
        proxy_pass http://data-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://control-plane:8080/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 业务路由 /assets 与 Vite 产物目录同名，必须优先回退到 SPA 入口。
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 嵌入式 Superset 专用监听（G4）：embedded-sdk 以此 origin 拼接 /embedded/{uuid}
# 与 Superset 原生顶层路由（/api、/static 同在此命名空间）；独立端口避免与
# 门户 80 的 /api、/static 冲突，且浏览器全程 HTTP（不受网关自签证书影响）。
# 甲方入口仍是门户页；此端口只承载 iframe，嵌入白名单按仪表盘 allowed_domains
# 校验 referrer。
server {
    listen 8084;
    server_name _;

    location / {
        proxy_pass http://superset:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
