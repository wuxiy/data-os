server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MPI 服务直路由：/api/v1/mpi/ 前缀完整转发（不改写路径），服务自持该命名空间。
    # portal 不依赖 mpi-service 存活——服务摘除时此路由 502，门户侧如实空态。
    location /api/v1/mpi/ {
        proxy_pass http://mpi-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://control-plane:8080/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 业务路由 /assets 与 Vite 产物目录同名，必须优先回退到 SPA 入口。
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
