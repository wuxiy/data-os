# P8（H3）：data-api 网关级限流 zone 预置。data-api 服务进入生产栈时，
# 在下方 server 块内启用（strip /dataapi 前缀）：
#   location /dataapi/ {
#       limit_req zone=dataapi burst=40 nodelay;
#       proxy_pass http://data-api:8080/;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_read_timeout 90s;
#   }
limit_req_zone $binary_remote_addr zone=dataapi:10m rate=2r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Replace id.example.invalid with the actual OIDC issuer host before
    # publishing the portal. The allowlist keeps token discovery/exchange
    # outside the browser's arbitrary cross-origin surface.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://id.example.invalid; form-action 'self' https://id.example.invalid" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_set_header Authorization $http_authorization;
    }

    location = /healthz {
        proxy_pass http://control-plane:8080/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Trace-Id $request_id;
    }

    # Do not expose management endpoints through the public portal.
    location ^~ /actuator/ {
        return 404;
    }

    # Vite's /assets directory conflicts with the portal's SPA fallback route.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
