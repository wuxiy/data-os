version: 2

sources:
  - name: quality_acceptance
    schema: "{{ env_var('DORIS_DATABASE', 'dataos_quality_acceptance') }}"
    tables:
      - name: quality_sample

  # 电子处方边缘链路（G5 前置机模拟）：EP_EDGE_S3_TO_DORIS 模板写入的
  # UNIQUE KEY(ID) 增量表。schema 独立于质量验收库，规则只列非 PHI 列。
  - name: ep_edge
    schema: "{{ env_var('DORIS_EP_DATABASE', 'ods_ep') }}"
    tables:
      - name: ep_mz_cfzb_edge
        columns:
          - name: ID
            description: 处方主表业务主键
            data_tests:
              - unique:
                  name: quality_ep_edge_cfzb_id_unique
              - not_null:
                  name: quality_ep_edge_cfzb_id_not_null
          - name: CFPTZT
            description: 处方平台状态（实测值域见规则注册表）
            data_tests:
              - accepted_values:
                  name: quality_ep_edge_cfzb_cfptzt_values
                  arguments:
                    values: [-1, 1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 13, 15, 16, 18, 20, 35]
      - name: ep_mz_ypcfmx_edge
        columns:
          - name: CFZID
            description: 处方组 ID（业务外键，指向主表 CFZID）
            data_tests:
              - relationships:
                  name: quality_ep_edge_ypcfmx_cfzid_fk
                  arguments:
                    to: source('ep_edge', 'ep_mz_cfzb_edge')
                    field: CFZID

  # EP 域首批 9 表（G16b，直连 SeaTunnel 采集，UNIQUE KEY 幂等）：处方生命周期
  # 深化 + 患者身份域（C 端注册路径）。FK 只登记源库聚合预检干净的引用边
  # （2026-09-02：EP_STATUS/EP_CHAIN/EP_FLOW 各有 1-2 个孤儿 EP_ID，测试库删
  # 主表所致，不注册为规则，见 docs/validation/gate-ep-g16b-*.md）。
  # ep_mz_cfzb 仅作 FK 目标登记，不带测试（其质量面由边缘链路规则覆盖）。
  - name: ep_domain
    schema: "{{ env_var('DORIS_EP_DATABASE', 'ods_ep') }}"
    tables:
      - name: ep_mz_cfzb
      - name: ep_status
        columns:
          - name: ID
            description: 处方状态表主键
            data_tests:
              - unique:
                  name: quality_ep_status_id_unique
              - not_null:
                  name: quality_ep_status_id_not_null
      - name: ep_chain
        columns:
          - name: ID
            description: 处方链路表主键
            data_tests:
              - unique:
                  name: quality_ep_chain_id_unique
              - not_null:
                  name: quality_ep_chain_id_not_null
          - name: EP_FLOW_ID
            description: 处方流转外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_chain_epflowid_fk
                  arguments:
                    to: source('ep_domain', 'ep_flow')
                    field: ID
      - name: ep_yb_rx
        columns:
          - name: HI_RXNO
            description: 医保处方号（业务主键，源库实测 12688 全唯一）
            data_tests:
              - unique:
                  name: quality_ep_yb_rx_hirxno_unique
              - not_null:
                  name: quality_ep_yb_rx_hirxno_not_null
      - name: ep_tag
        columns:
          - name: ID
            description: 处方标签主键
            data_tests:
              - unique:
                  name: quality_ep_tag_id_unique
              - not_null:
                  name: quality_ep_tag_id_not_null
          - name: EP_ID
            description: 处方外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_tag_epid_fk
                  arguments:
                    to: source('ep_domain', 'ep_mz_cfzb')
                    field: ID
      - name: ep_flow
        columns:
          - name: ID
            description: 处方流转表主键
            data_tests:
              - unique:
                  name: quality_ep_flow_id_unique
              - not_null:
                  name: quality_ep_flow_id_not_null
      - name: ep_drug_ext
        columns:
          - name: ID
            description: 处方药品扩展主键
            data_tests:
              - unique:
                  name: quality_ep_drug_ext_id_unique
              - not_null:
                  name: quality_ep_drug_ext_id_not_null
          - name: EP_ID
            description: 处方外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_drug_ext_epid_fk
                  arguments:
                    to: source('ep_domain', 'ep_mz_cfzb')
                    field: ID
      - name: patient
        columns:
          - name: ID
            description: 患者主档主键
            data_tests:
              - unique:
                  name: quality_patient_id_unique
              - not_null:
                  name: quality_patient_id_not_null
          - name: DEL
            description: 逻辑删除标记（源库实测值域 {0,1}）
            data_tests:
              - accepted_values:
                  name: quality_patient_del_values
                  arguments:
                    values: [0, 1]
      - name: patient_card
        columns:
          - name: ID
            description: 就诊卡主键
            data_tests:
              - unique:
                  name: quality_patient_card_id_unique
              - not_null:
                  name: quality_patient_card_id_not_null
          - name: PATIENT_ID
            description: 患者外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_patient_card_patientid_fk
                  arguments:
                    to: source('ep_domain', 'patient')
                    field: ID
      - name: patient_ep_record
        columns:
          - name: ID
            description: 患者处方记录主键
            data_tests:
              - unique:
                  name: quality_patient_ep_record_id_unique
              - not_null:
                  name: quality_patient_ep_record_id_not_null
          - name: PATIENT_ID
            description: 患者外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_patient_ep_record_patientid_fk
                  arguments:
                    to: source('ep_domain', 'patient')
                    field: ID
          - name: EP_ID
            description: 处方外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_patient_ep_record_epid_fk
                  arguments:
                    to: source('ep_domain', 'ep_mz_cfzb')
                    field: ID

  # G16c 二批：ORDER 交易域 6 表（源表 ORDER 为保留字，Doris 侧统一 ep_ 前缀，
  # 见 init-ods-ep-g16c.sql 命名偏差记录）。2026-09-03 源库预检：PK 与 ORDER.SN
  # 全唯一、七条外键边全部 0 孤儿；关联键为业务串 ORDER_SN（非 ID 外键）。
  - name: ep_transaction
    schema: "{{ env_var('DORIS_EP_DATABASE', 'ods_ep') }}"
    tables:
      - name: ep_order
        columns:
          - name: ID
            description: 订单主键
            data_tests:
              - unique:
                  name: quality_ep_order_id_unique
              - not_null:
                  name: quality_ep_order_id_not_null
          - name: EP_ID
            description: 处方外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_epid_fk
                  arguments:
                    to: source('ep_domain', 'ep_mz_cfzb')
                    field: ID
          - name: PATIENT_ID
            description: 患者外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_patientid_fk
                  arguments:
                    to: source('ep_domain', 'patient')
                    field: ID
          - name: PAY_STATUS
            description: 支付状态（源库实测值域 {10,15,16,18,20}）
            data_tests:
              - accepted_values:
                  name: quality_ep_order_paystatus_values
                  arguments:
                    values: [10, 15, 16, 18, 20]
      - name: ep_order_item
        columns:
          - name: ID
            description: 订单药品主键
            data_tests:
              - unique:
                  name: quality_ep_order_item_id_unique
              - not_null:
                  name: quality_ep_order_item_id_not_null
          - name: ORDER_SN
            description: 订单业务号外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_item_ordersn_fk
                  arguments:
                    to: source('ep_transaction', 'ep_order')
                    field: SN
      - name: ep_order_flow
        columns:
          - name: ID
            description: 订单流水主键
            data_tests:
              - unique:
                  name: quality_ep_order_flow_id_unique
              - not_null:
                  name: quality_ep_order_flow_id_not_null
          - name: ORDER_SN
            description: 订单业务号外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_flow_ordersn_fk
                  arguments:
                    to: source('ep_transaction', 'ep_order')
                    field: SN
      - name: ep_order_trade
        columns:
          - name: ID
            description: 交易主键
            data_tests:
              - unique:
                  name: quality_ep_order_trade_id_unique
              - not_null:
                  name: quality_ep_order_trade_id_not_null
          - name: ORDER_SN
            description: 订单业务号外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_trade_ordersn_fk
                  arguments:
                    to: source('ep_transaction', 'ep_order')
                    field: SN
      - name: ep_order_relationship
        columns:
          - name: ID
            description: 订单-处方关联主键
            data_tests:
              - unique:
                  name: quality_ep_order_relationship_id_unique
              - not_null:
                  name: quality_ep_order_relationship_id_not_null
          - name: EP_ID
            description: 处方外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_relationship_epid_fk
                  arguments:
                    to: source('ep_domain', 'ep_mz_cfzb')
                    field: ID
          - name: VALID
            description: 有效标记（源库实测值域 {0,1}，NUMBER 类型）
            data_tests:
              - accepted_values:
                  name: quality_ep_order_relationship_valid_values
                  arguments:
                    values: [0, 1]
      - name: ep_order_after_sale
        columns:
          - name: ID
            description: 售后单主键
            data_tests:
              - unique:
                  name: quality_ep_order_after_sale_id_unique
              - not_null:
                  name: quality_ep_order_after_sale_id_not_null
          - name: ORDER_SN
            description: 订单业务号外键（源库预检 0 孤儿）
            data_tests:
              - relationships:
                  name: quality_ep_order_after_sale_ordersn_fk
                  arguments:
                    to: source('ep_transaction', 'ep_order')
                    field: SN

  # G16c 二批：机构维度 2 表（INSTITUTION 有 CODE 列，为患者域/处方域机构码的
  # 主数据桥梁；INSTITUTION_INFO 为扩展信息）。
  - name: ep_institution
    schema: "{{ env_var('DORIS_EP_DATABASE', 'ods_ep') }}"
    tables:
      - name: institution
        columns:
          - name: ID
            description: 机构主键
            data_tests:
              - unique:
                  name: quality_institution_id_unique
              - not_null:
                  name: quality_institution_id_not_null
      - name: institution_info
        columns:
          - name: ID
            description: 机构扩展信息主键
            data_tests:
              - unique:
                  name: quality_institution_info_id_unique
              - not_null:
                  name: quality_institution_info_id_not_null
