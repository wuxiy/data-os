server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: data-os-mpi
  datasource:
    url: ${DATAOS_MPI_DB_URL:jdbc:postgresql://localhost:5432/keycloak}
    username: ${DATAOS_MPI_DB_USERNAME:dataos_mpi}
    # 开发/生产运行时必须显式注入，避免把默认口令带入部署环境。
    password: ${DATAOS_MPI_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATAOS_MPI_DB_POOL_SIZE:8}
      connection-timeout: 3000
  sql:
    init:
      mode: never
      continue-on-error: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 迁移历史表放在 MPI 独占 schema 内，与同库其他服务的 Flyway 历史隔离。
    schemas: data_os_mpi
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

data-os:
  auth:
    # fail closed：生产为默认，仅本地/开发部署显式选择 DISABLED。
    mode: ${DATAOS_MPI_AUTH_MODE:ENFORCED}
    issuer-uri: ${DATAOS_MPI_OIDC_ISSUER_URI:}
    audience: ${DATAOS_MPI_OIDC_AUDIENCE:data-os-mpi}
    clock-skew-seconds: ${DATAOS_MPI_OIDC_CLOCK_SKEW_SECONDS:60}
    default-tenant-id: ${DATAOS_MPI_DEFAULT_TENANT_ID:default}
    default-institution-id: ${DATAOS_MPI_DEFAULT_INSTITUTION_ID:demo-hospital}
    allow-default-scope: ${DATAOS_MPI_DEFAULT_SCOPE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: data-os mpi service
    version: 0.1.0
