# 质量规则注册表。规则语义（谓词、值域、外键目标）的唯一权威是
# quality/dbt 工程的测试声明——selector 与 dbt 测试 name 同名互绑。
# evidence 块只声明执行器自己的展示契约：
#   kind    = dbt 通用测试族，决定失败表的形状（见 evidence.py）
#   column  = 被测列（聚合形状的值列按它命名投影）
#   columns = 证据列白名单与脱敏分类（IDENTIFIER/CATEGORY/SAFE/REDACTED）
rules:
  - rule_id: quality.acceptance.not_null_patient_id
    selector: quality_acceptance_not_null_patient_id
    dataset_id: dataos_quality_acceptance.quality_sample
    evidence:
      kind: not_null
      column: patient_id
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: status, classification: CATEGORY}
  - rule_id: quality.acceptance.unique_record_id
    selector: quality_acceptance_unique_record_id
    dataset_id: dataos_quality_acceptance.quality_sample
    evidence:
      kind: unique
      column: record_id
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: status, classification: CATEGORY}
  - rule_id: quality.acceptance.status_values
    selector: quality_acceptance_status_values
    dataset_id: dataos_quality_acceptance.quality_sample
    evidence:
      kind: accepted_values
      column: status
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: status, classification: CATEGORY}
  # Compatibility bindings for the first hospital governance seed records.
  # They intentionally point at the synthetic acceptance table until each
  # institution supplies its LIS/EMR/surgery table contract; the rule IDs
  # remain stable so an issue can be rechecked without a DEMO executor.
  - rule_id: rule-timeliness-result-time
    selector: quality_acceptance_timeliness_result_time
    dataset_id: asset-lis-lab-result
    evidence:
      kind: not_null
      column: updated_at
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: updated_at, classification: SAFE}
  - rule_id: rule-icd10-mapping
    selector: quality_acceptance_icd10_mapping
    dataset_id: asset-emr-diagnosis
    evidence:
      kind: accepted_values
      column: status
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: status, classification: CATEGORY}
  - rule_id: rule-surgery-required-fields
    selector: quality_acceptance_surgery_required_fields
    dataset_id: asset-surgery-record
    evidence:
      kind: not_null
      column: patient_id
      columns:
        - {name: record_id, classification: IDENTIFIER}
        - {name: patient_id, classification: IDENTIFIER}
        - {name: status, classification: CATEGORY}
  # 电子处方边缘链路（G5 前置机模拟）：MiNiFi→RustFS→SeaTunnel 写入的
  # ods_ep 边缘增量表（UNIQUE KEY(ID) 幂等）。主键唯一/非空是在册常态
  # 守卫——UNIQUE KEY 表天然无法驻留重复主键，失败场景以值域与外键违规
  # 实证（见 gate-hospital-edge L3）。证据列只列非 PHI 列。
  - rule_id: quality.ep.edge.cfzb-id-not-null
    selector: quality_ep_edge_cfzb_id_not_null
    dataset_id: asset-ep-prescription-edge
    evidence:
      kind: not_null
      column: ID
      columns:
        - {name: ID, classification: IDENTIFIER}
        - {name: CFPTZT, classification: CATEGORY}
        - {name: KFRQ, classification: SAFE}
  - rule_id: quality.ep.edge.cfzb-id-unique
    selector: quality_ep_edge_cfzb_id_unique
    dataset_id: asset-ep-prescription-edge
    evidence:
      kind: unique
      column: ID
