[build-system]
requires = ["setuptools>=69,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos-ai-ready-service"
version = "0.1.0"
description = "DataOS AI Data Readiness Assessment & Certification Engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pymysql==1.1.1",
  "httpx==0.28.1",
  "prometheus-client==0.21.1",
  "PyYAML==6.0.2",
  "PyJWT[crypto]==2.10.1",
  "boto3==1.36.20",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["app"]
