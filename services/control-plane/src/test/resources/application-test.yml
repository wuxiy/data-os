spring:
  datasource:
    url: jdbc:h2:mem:dataos;MODE=PostgreSQL
    username: sa
    password:
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

data-os:
  runtime:
    environment: test
  auth:
    mode: DISABLED
    default-tenant-id: default
    default-institution-id: demo-hospital
  source-network:
    allow-http: true
    allow-private-networks: true
    allow-test-protocols: true
  seed-demo: false
  quality:
    executor: DEMO
    demo-enabled: true
    demo-delay-ms: 0
    poll-interval-ms: 3600000
    poll-initial-delay-ms: 3600000
    sla-scan-interval-ms: 3600000
    sla-scan-initial-delay-ms: 3600000
    submit-lease-ms: 120000
  notification:
    health-url: ""
    delivery-interval-ms: 3600000
    delivery-initial-delay-ms: 3600000
  runs:
    sync-interval-ms: 3600000
    sync-initial-delay-ms: 3600000
