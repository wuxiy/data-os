server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: data-os-control-plane
  datasource:
    url: ${DATAOS_DB_URL:jdbc:postgresql://localhost:5432/data_os}
    username: ${DATAOS_DB_USERNAME:data_os}
    # 开发/生产运行时必须显式注入，避免把默认口令带入部署环境。
    password: ${DATAOS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATAOS_DB_POOL_SIZE:10}
      connection-timeout: 3000
  sql:
    init:
      mode: never
      continue-on-error: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: ${DATAOS_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${DATAOS_FLYWAY_BASELINE_VERSION:0}
    clean-disabled: true

data-os:
  runtime:
    # Fail closed: production is the default unless a local/dev deployment opts in explicitly.
    environment: ${DATAOS_RUNTIME_ENV:production}
    external-https-terminated: ${DATAOS_EXTERNAL_HTTPS_TERMINATED:false}
  auth:
    mode: ${DATAOS_AUTH_MODE:ENFORCED}
    issuer-uri: ${DATAOS_OIDC_ISSUER_URI:}
    audience: ${DATAOS_OIDC_AUDIENCE:data-os}
    clock-skew-seconds: ${DATAOS_OIDC_CLOCK_SKEW_SECONDS:60}
    default-tenant-id: ${DATAOS_DEFAULT_TENANT_ID:default}
    default-institution-id: ${DATAOS_DEFAULT_INSTITUTION_ID:demo-hospital}
    allow-default-scope: ${DATAOS_DEFAULT_SCOPE_ENABLED:true}
  credentials:
    encryption-key: ${DATAOS_CREDENTIAL_ENCRYPTION_KEY:}
  source-network:
    allow-http: ${DATAOS_SOURCE_ALLOW_HTTP:false}
    allow-private-networks: ${DATAOS_SOURCE_ALLOW_PRIVATE_NETWORKS:false}
    allow-test-protocols: ${DATAOS_SOURCE_ALLOW_TEST_PROTOCOLS:false}
    max-response-bytes: ${DATAOS_SOURCE_MAX_RESPONSE_BYTES:65536}
    allowed-hosts: ${DATAOS_SOURCE_ALLOWED_HOSTS:}
  seed-demo: ${DATAOS_SEED_DEMO:false}
  seatunnel:
    base-url: ${SEATUNNEL_BASE_URL:}
    time-zone: ${DATAOS_SEATUNNEL_TIME_ZONE:UTC}
  openmetadata:
    # 血缘/资产读链（G1 锚点 → G2 BFF）：不配置则整链不装配，血缘 API 返回 503。
    base-url: ${DATAOS_OPENMETADATA_BASE_URL:}
    token-uri: ${DATAOS_OPENMETADATA_TOKEN_URI:}
    client-id: ${DATAOS_OPENMETADATA_CLIENT_ID:}
    client-secret: ${DATAOS_OPENMETADATA_CLIENT_SECRET:}
    service-name: ${DATAOS_OPENMETADATA_SERVICE_NAME:doris-dataos}
    dashboard-service-name: ${DATAOS_OPENMETADATA_DASHBOARD_SERVICE_NAME:superset-dataos}
    database-segment: ${DATAOS_OPENMETADATA_DATABASE_SEGMENT:default}
  platform:
    # These URLs are for server-side probes and browser entrypoints only.
    # Credentials and internal service addresses are never returned by the API.
    seatunnel-ui-url: ${DATAOS_SEATUNNEL_UI_URL:}
    dolphinscheduler-ui-url: ${DATAOS_DOLPHINSCHEDULER_UI_URL:}
    rustfs-endpoint: ${DATAOS_RUSTFS_ENDPOINT:}
    rustfs-console-url: ${DATAOS_RUSTFS_CONSOLE_URL:}
  dolphinscheduler:
    base-url: ${DOLPHINSCHEDULER_BASE_URL:}
    token: ${DATAOS_DOLPHINSCHEDULER_TOKEN:}
    token-file: ${DATAOS_DOLPHINSCHEDULER_TOKEN_FILE:}
    username: ${DATAOS_DOLPHINSCHEDULER_USERNAME:}
    password: ${DATAOS_DOLPHINSCHEDULER_PASSWORD:}
    time-zone: ${DATAOS_DOLPHINSCHEDULER_TIME_ZONE:Asia/Shanghai}
    tenant-code: ${DATAOS_DOLPHINSCHEDULER_TENANT_CODE:}
  quality:
    executor: ${DATAOS_QUALITY_EXECUTOR:HTTP}
    base-url: ${DATAOS_QUALITY_EXECUTOR_BASE_URL:}
    demo-enabled: ${DATAOS_QUALITY_DEMO_ENABLED:false}
    oidc:
      token-uri: ${DATAOS_QUALITY_OIDC_TOKEN_URI:}
      client-id: ${DATAOS_QUALITY_OIDC_CLIENT_ID:}
      client-secret: ${DATAOS_QUALITY_OIDC_CLIENT_SECRET:}
      audience: ${DATAOS_QUALITY_OIDC_AUDIENCE:dataos-quality-runner}
      scopes: ${DATAOS_QUALITY_OIDC_SCOPES:quality:submit quality:read}
    demo-delay-ms: ${DATAOS_QUALITY_DEMO_DELAY_MS:500}
    poll-interval-ms: ${DATAOS_QUALITY_POLL_INTERVAL_MS:30000}
    poll-initial-delay-ms: ${DATAOS_QUALITY_POLL_INITIAL_DELAY_MS:10000}
    sla-scan-interval-ms: ${DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS:60000}
    sla-scan-initial-delay-ms: ${DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS:15000}
    submit-lease-ms: ${DATAOS_QUALITY_SUBMIT_LEASE_MS:120000}
  notification:
    webhook-url: ${DATAOS_NOTIFICATION_WEBHOOK_URL:}
    health-url: ${DATAOS_NOTIFICATION_HEALTH_URL:}
    webhook-secret: ${DATAOS_NOTIFICATION_WEBHOOK_SECRET:}
    webhook-secret-file: ${DATAOS_NOTIFICATION_WEBHOOK_SECRET_FILE:}
    allow-http: ${DATAOS_NOTIFICATION_ALLOW_HTTP:false}
    allow-private-networks: ${DATAOS_NOTIFICATION_ALLOW_PRIVATE_NETWORKS:false}
    allowed-hosts: ${DATAOS_NOTIFICATION_ALLOWED_HOSTS:}
    max-attempts: ${DATAOS_NOTIFICATION_MAX_ATTEMPTS:5}
    lease-ms: ${DATAOS_NOTIFICATION_LEASE_MS:120000}
    delivery-interval-ms: ${DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS:30000}
    delivery-initial-delay-ms: ${DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS:10000}
  runs:
    sync-interval-ms: ${DATAOS_RUN_SYNC_INTERVAL_MS:30000}
    sync-initial-delay-ms: ${DATAOS_RUN_SYNC_INITIAL_DELAY_MS:10000}
    submit-lease-ms: ${DATAOS_RUN_SUBMIT_LEASE_MS:120000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: data-os control plane
    version: 0.1.0
