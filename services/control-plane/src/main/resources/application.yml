server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: data-os-control-plane
  datasource:
    url: ${DATAOS_DB_URL:jdbc:postgresql://localhost:5432/data_os}
    username: ${DATAOS_DB_USERNAME:data_os}
    # 开发/生产运行时必须显式注入，避免把默认口令带入部署环境。
    password: ${DATAOS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATAOS_DB_POOL_SIZE:10}
      connection-timeout: 3000
  sql:
    init:
      mode: always
      continue-on-error: false

data-os:
  runtime:
    # Fail closed: production is the default unless a local/dev deployment opts in explicitly.
    environment: ${DATAOS_RUNTIME_ENV:production}
  seed-demo: ${DATAOS_SEED_DEMO:false}
  seatunnel:
    base-url: ${SEATUNNEL_BASE_URL:}
    time-zone: ${DATAOS_SEATUNNEL_TIME_ZONE:UTC}
  quality:
    executor: ${DATAOS_QUALITY_EXECUTOR:HTTP}
    base-url: ${DATAOS_QUALITY_EXECUTOR_BASE_URL:}
    demo-enabled: ${DATAOS_QUALITY_DEMO_ENABLED:false}
    demo-delay-ms: ${DATAOS_QUALITY_DEMO_DELAY_MS:500}
    poll-interval-ms: ${DATAOS_QUALITY_POLL_INTERVAL_MS:30000}
    poll-initial-delay-ms: ${DATAOS_QUALITY_POLL_INITIAL_DELAY_MS:10000}
    sla-scan-interval-ms: ${DATAOS_QUALITY_SLA_SCAN_INTERVAL_MS:60000}
    sla-scan-initial-delay-ms: ${DATAOS_QUALITY_SLA_SCAN_INITIAL_DELAY_MS:15000}
    submit-lease-ms: ${DATAOS_QUALITY_SUBMIT_LEASE_MS:120000}
  notification:
    webhook-url: ${DATAOS_NOTIFICATION_WEBHOOK_URL:}
    max-attempts: ${DATAOS_NOTIFICATION_MAX_ATTEMPTS:5}
    lease-ms: ${DATAOS_NOTIFICATION_LEASE_MS:120000}
    delivery-interval-ms: ${DATAOS_NOTIFICATION_DELIVERY_INTERVAL_MS:30000}
    delivery-initial-delay-ms: ${DATAOS_NOTIFICATION_DELIVERY_INITIAL_DELAY_MS:10000}
  runs:
    sync-interval-ms: ${DATAOS_RUN_SYNC_INTERVAL_MS:30000}
    sync-initial-delay-ms: ${DATAOS_RUN_SYNC_INITIAL_DELAY_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

info:
  app:
    name: data-os control plane
    version: 0.1.0
