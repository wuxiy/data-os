<h1>高血压临床诊疗指南（合成版·2026）</h1>
<h2>概述</h2>
<p>高血压是以体循环动脉血压升高为主要特征的心血管综合征。本指南适用于门诊与住院场景的成人原发性高血压诊疗。</p>
<p>诊断阈值：诊室血压收缩压≥140mmHg 和/或舒张压≥90mmHg。</p>
<h2>分级标准</h2>
<p>1 级：收缩压 140-159 或舒张压 90-99；2 级：160-179 或 100-109；3 级：≥180 或 ≥110。</p>
<p>危险分层需结合心血管危险因素、靶器官损害与并存临床情况综合判定。</p>
<h2>治疗原则</h2>
<p>生活方式干预贯穿全程：限盐、控重、戒烟、限酒、运动。</p>
<p>药物治疗首选五大类：ACEI、ARB、CCB、噻嗪类利尿剂、β受体阻滞剂。</p>
