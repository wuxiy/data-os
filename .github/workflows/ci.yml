name: data-os CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: data-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: control-plane tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test control plane
        run: mvn -B -ntp -f services/control-plane/pom.xml test

      - name: Test platformctl operational facts contract
        run: bash deploy/production/tests/platformctl-operational-facts-test.sh

      - name: Package control plane
        run: mvn -B -ntp -f services/control-plane/pom.xml -DskipTests package

      - name: Build control-plane image
        run: docker build --tag data-os-control-plane:ci services/control-plane

      - name: Scan control-plane image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: data-os-control-plane:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate control-plane SBOM
        uses: anchore/sbom-action@v0
        with:
          image: data-os-control-plane:ci
          format: cyclonedx-json
          output-file: sbom-control-plane.cdx.json

      - name: Upload control-plane SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-control-plane
          path: sbom-control-plane.cdx.json

  security:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-runner:
    name: quality runner tests and image supply-chain checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test quality runner contract
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.3.4 pytest-asyncio==0.25.3 PyYAML==6.0.2 SQLAlchemy==2.0.37 PyMySQL==1.1.1 boto3==1.36.20
          PYTHONPATH=services/quality-runner/app python -m pytest -q services/quality-runner/tests
          python -m compileall -q services/quality-runner/app

      - name: Build quality runner image
        run: docker build --file services/quality-runner/Dockerfile --tag data-os-quality-runner:ci .

      - name: Scan quality runner image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: data-os-quality-runner:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate quality runner SBOM
        uses: anchore/sbom-action@v0
        with:
          image: data-os-quality-runner:ci
          format: cyclonedx-json
          output-file: sbom-quality-runner.cdx.json

      - name: Upload quality runner SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-quality-runner
          path: sbom-quality-runner.cdx.json

  frontend:
    name: portal typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify mock boundaries and portal interactions
        run: |
          npm run qa:mock
          node qa/portal-interactions-smoke.mjs

      - name: Build portal
        run: npm run build

  deployment-manifests:
    name: validate production manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Run clinical replay source contract smoke
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          process = subprocess.Popen([
              "python", "deploy/dev/replay-source/server.py", "--port", "18084"
          ])
          try:
              url = "http://127.0.0.1:18084/api/lab/results?since=2026-08-11T08:05:00Z&until=2026-08-11T08:06:00Z"
              for _ in range(30):
                  try:
                      with urllib.request.urlopen("http://127.0.0.1:18084/healthz", timeout=1) as response:
                          if response.status == 200:
                              break
                  except Exception:
                      time.sleep(0.2)
              else:
                  raise SystemExit("replay source did not become healthy")
              with urllib.request.urlopen(url, timeout=3) as response:
                  payload = json.load(response)
              assert payload["sourceSystem"] == "LIS"
              assert payload["watermarkStart"] == "2026-08-11T08:05:00Z"
              assert [row["record_id"] for row in payload["data"]] == ["LIS-R-0001"]
          finally:
              process.terminate()
              process.wait(timeout=5)
          PY

      - name: Validate Compose file
        run: docker compose --env-file deploy/production/.env.example -f deploy/production/docker-compose.yml config --quiet

      - name: Validate DolphinScheduler overlays
        env:
          DATAOS_DB_PASSWORD: ci-data-os-password
          DOLPHINSCHEDULER_DB_PASSWORD: ci-dolphinscheduler-password
        run: |
          docker compose \
            --env-file deploy/production/.env.example \
            -f deploy/production/docker-compose.yml \
            -f deploy/production/dolphinscheduler-compose.yml \
            config --quiet
          docker compose \
            -f deploy/dev/docker-compose.yml \
            -f deploy/dev/dolphinscheduler/docker-compose.yml \
            --profile scheduler \
            config --quiet

      - name: Validate tenant provisioning scripts
        run: |
          sh -n deploy/scripts/load-dotenv.sh
          sh -n deploy/dev/dolphinscheduler/provision-named-tenant.sh
          sh -n deploy/production/provision-named-tenant.sh
          test -s deploy/dolphinscheduler/clinical-tenant-migration.sql
          test -s deploy/data-os/clinical-workflow-migration.sql

      - name: Validate SeaTunnel offline release scripts
        run: |
          for script in deploy/seatunnel/scripts/*.sh; do
            sh -n "$script"
            test -x "$script"
          done
          test -s deploy/seatunnel/manifest.env
          test -s deploy/seatunnel/driver-manifest.tsv
          test -s deploy/seatunnel/plugin_config
          ! grep -R -Ei 'shell[-_ ]?plugin|install-plugin.*shell|connector-shell' \
            deploy/seatunnel/plugin_config deploy/seatunnel/Dockerfile \
            deploy/production/seatunnel-compose.yml
          grep -q 'DATAOS_ALLOW_MISSING_SBOM is forbidden' deploy/seatunnel/scripts/package-offline.sh
          grep -q 'loaded image does not match release manifest' deploy/seatunnel/scripts/load-offline-bundle.sh
          grep -q 'unsigned activation is allowed only' deploy/seatunnel/scripts/activate.sh
          grep -q 'DATAOS_ACTIVATION_IMAGE' deploy/seatunnel/scripts/activate.sh

      - name: Validate SeaTunnel production overlays
        env:
          DATAOS_DB_PASSWORD: ci-data-os-password
          DOLPHINSCHEDULER_DB_PASSWORD: ci-dolphinscheduler-password
        run: |
          docker compose \
            --env-file deploy/production/.env.example \
            -f deploy/production/docker-compose.yml \
            -f deploy/production/seatunnel-compose.yml \
            config --quiet
          docker compose \
            --env-file deploy/production/.env.example \
            -f deploy/production/docker-compose.yml \
            -f deploy/production/seatunnel-external-compose.yml \
            config --quiet
          grep -q 'SEATUNNEL_IMAGE must be set' deploy/production/seatunnel-compose.yml
          grep -q 'SEATUNNEL_BASE_URL must point' deploy/production/seatunnel-external-compose.yml

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --volume "$PWD/deploy/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Reject mutable production image tags
        run: |
          ! grep -Eq '(^|:)latest([[:space:]]|$)' deploy/production/docker-compose.yml deploy/production/.env.example

  dependency-review:
    name: dependency diff review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
