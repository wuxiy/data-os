name: data-os CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: data-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: control-plane tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test control plane
        run: mvn -B -ntp -f services/control-plane/pom.xml test

      - name: Package control plane
        run: mvn -B -ntp -f services/control-plane/pom.xml -DskipTests package

      - name: Build control-plane image
        run: docker build --tag data-os-control-plane:ci services/control-plane

      - name: Scan control-plane image for high and critical CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: data-os-control-plane:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate control-plane SBOM
        uses: anchore/sbom-action@v0
        with:
          image: data-os-control-plane:ci
          format: cyclonedx-json
          output-file: sbom-control-plane.cdx.json

      - name: Upload control-plane SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-control-plane
          path: sbom-control-plane.cdx.json

  security:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: portal typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify mock boundaries and portal interactions
        run: |
          npm run qa:mock
          node qa/portal-interactions-smoke.mjs

      - name: Build portal
        run: npm run build

  deployment-manifests:
    name: validate production manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whitespace errors
        run: git diff --check

      - name: Validate Compose file
        run: docker compose --env-file deploy/production/.env.example -f deploy/production/docker-compose.yml config --quiet

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --volume "$PWD/deploy/production/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v2.54.1 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Reject mutable production image tags
        run: |
          ! grep -Eq '(^|:)latest([[:space:]]|$)' deploy/production/docker-compose.yml deploy/production/.env.example

  dependency-review:
    name: dependency diff review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
